services:
  - type: web
    name: arnix-video-engine
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_SECRET
        generateValue: true
      - key: ALLOHA_TOKEN
        sync: false
